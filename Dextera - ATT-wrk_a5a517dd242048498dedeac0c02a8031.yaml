                            "cust_Tipo_Flujo": "01",
                            "cust_Completado": "4",
                            "cust_Replica": "0",
                            "cust_PuestosAnteriores": "<table><tr><td>Analista de Sistemas, Licenciatura en Informática, Licenciatura en Tecnología de la Información</td><td style=\"text-align:right;\">1 año</td></tr><tr><td>Especialista de Sistemas, Licenciatura en Informática, Licenciatura en Tecnología de la Información</td><td style=\"text-align:right;\">2 años</td></tr></table>",
                            "cust_PropositoDeInteraccion": "1001669",
                            "externalName": "391678",
                            "cust_PrincipalesResponsabilidades": "<p></p><table style=\"border-collapse: collapse; width: 100.105%;\" border=\"1\"><colgroup><col style=\"width: 25.0013%;\" /><col style=\"width: 25.0013%;\" /><col style=\"width: 25.0013%;\" /><col style=\"width: 25.0013%;\" /></colgroup><tbody><tr><td>1</td><td>¿Qué?</td><td>Mantener operando y estable las aplicaciones de Recursos Humanos,</td><td>25</td></tr><tr><td></td><td>¿Cómo?</td><td><p>mediante una serie de monitoreo constantes</p></td><td></td></tr><tr><td></td><td>¿Para qué?</td><td>para asegurar su funcionamiento.</td><td></td></tr><tr><td>2</td><td>¿Qué?</td><td>Asegurar la calidad de los datos que contienen las plataformas de Recursos Humanos,</td><td>25</td></tr><tr><td></td><td>¿Cómo?</td><td><p>se utilizan diferentes medios como reportes, comparativos de datos,</p></td><td></td></tr><tr><td></td><td>¿Para qué?</td><td>para validaciones constantes.</td><td></td></tr><tr><td>3</td><td>¿Qué?</td><td>Mantener la información actualizada en las diferentes plataformas que consumen la información de Recursos Humanos,</td><td>25</td></tr><tr><td></td><td>¿Cómo?</td><td><p>para esta actividad se manejan diferentes interfaces y tecnologías</p></td><td></td></tr><tr><td></td><td>¿Para qué?</td><td>dependiendo de la arquitectura de la plataforma cliente.</td><td></td></tr><tr><td>4</td><td>¿Qué?</td><td>Apoyo permanente y continuo a los usuarios que gestionan las plataformas de Recursos Humanos</td><td>25</td></tr><tr><td></td><td>¿Cómo?</td><td><p>a través de llamadas o correos</p></td><td></td></tr><tr><td></td><td>¿Para qué?</td><td>para solucionar dudas.</td><td></td></tr></tbody></table><p></p>",
                            "cust_VP": "VP Recursos Humanos (V0000008)",
                            "cust_NIveles_Riesgo": "null",
                            "cust_Educacion": "<table style=\"border-collapse: collapse;\" border=\"1\"><tr><td style=\"padding: 6px 12px; vertical-align: top;\"><strong>Mínima:</strong></td><td style=\"padding: 6px 12px; vertical-align: top;\">Licenciatura/Ingeniería Titulado en Sistemas, redes, telecomunicaciones, electrónica o afin.</td></tr><tr><td style=\"padding: 6px 12px; vertical-align: top;\"><strong>Deseada:</strong></td><td style=\"padding: 6px 12px; vertical-align: top;\">Licenciatura/Ingeniería Titulado en Sistemas, redes, telecomunicaciones, electrónica o afin.</td></tr></table>",
                            "cust_ObjetivoDePosicion": "<table style=\"border-collapse: collapse;\" border=\"1\"><tr><td style=\"padding: 6px 12px; vertical-align: top;\">1.</td><td style=\"padding: 6px 12px; vertical-align: top;\">Nivel Táctico</td><td style=\"padding: 6px 12px; vertical-align: top;\">Facilitar los procesos claves de Recursos Humanos, con el fin de reducir costos de operación mediante la integración de aplicaciones, para sustituir los procesos manuales con procesos automatizados.</td></tr><tr><td style=\"padding: 6px 12px; vertical-align: top;\">2.</td><td style=\"padding: 6px 12px; vertical-align: top;\">Nivel Operativo</td><td style=\"padding: 6px 12px; vertical-align: top;\">Analizar la información de los procesos de Recursos Humanos, mediante el uso de herramientas tecnológicas, para resaltar información útil que se adapte a las necesidades del área mejorando la eficacia y efectividad de la operación.</td></tr><tr><td style=\"padding: 6px 12px; vertical-align: top;\">3.</td><td style=\"padding: 6px 12px; vertical-align: top;\">Nivel Estratégico</td><td style=\"padding: 6px 12px; vertical-align: top;\">Administrar la plataforma tecnológica de Recursos Humanos, verificando que se adhieran a los procesos establecidos, en el aspecto técnico como administrativo, para garantizar la continuidad de la operación.</td></tr></table>",
                            "cust_PrincipalesResponsabilidades_Editado": "<ul><li>Mantener operando y estable las aplicaciones de Recursos Humanos, mediante una serie de monitoreo constantes para asegurar su funcionamiento.</li><li>Asegurar la calidad de los datos que contienen las plataformas de Recursos Humanos, se utilizan diferentes medios como reportes, comparativos de datos, para validaciones constantes.</li><li>Mantener la información actualizada en las diferentes plataformas que consumen la información de Recursos Humanos, para esta actividad se manejan diferentes interfaces y tecnologías dependiendo de la arquitectura de la plataforma cliente.</li><li>Apoyo permanente y continuo a los usuarios que gestionan las plataformas de Recursos Humanos a través de llamadas o correos para solucionar dudas.</li></ul>",
                            "cust_Id_Workflow": null,
                            "cust_PaquetesDeComputo": "<ul><li>Paquetería Office</li><li>Success Factors</li><li>SQL</li></ul>",
                            "mdfSystemRecordStatus": "N",
                            "cust_cometario_rechazo": null,
                            "cust_Grado": "A_14",
                            "cust_titulo_sugerido": null,
                            "cust_Proceso_Hijo": "1",
                            "cust_Idiomas": "<table style=\"border-collapse: collapse;\" border=\"1\"><tr><td style=\"padding: 6px 12px; vertical-align: top;\"><strong>Idioma</strong></td><td style=\"padding: 6px 12px; vertical-align: top;\"><strong>Habla</strong></td><td style=\"padding: 6px 12px; vertical-align: top;\"><strong>Escribe</strong></td><td style=\"padding: 6px 12px; vertical-align: top;\"><strong>Lee</strong></td></tr><tr><td style=\"padding: 6px 12px; vertical-align: top;\">Ingles</td><td style=\"padding: 6px 12px; vertical-align: top;\">Intermedio</td><td style=\"padding: 6px 12px; vertical-align: top;\">Intermedio</td><td style=\"padding: 6px 12px; vertical-align: top;\">Intermedio</td></tr></table>",
                            "cust_Titulo_Ingles": "Coordinador HRIS",
                            "cust_Experiencia": "<table style=\"border-collapse: collapse;\" border=\"1\"><tr><td style=\"padding: 6px 12px; vertical-align: top;\"><strong>Mínima:</strong></td><td style=\"padding: 6px 12px; vertical-align: top;\">3 años</td></tr><tr><td style=\"padding: 6px 12px; vertical-align: top;\"><strong>Deseada:</strong></td><td style=\"padding: 6px 12px; vertical-align: top;\">5 años</td></tr></table>",
                            "cust_InteraccionesRelaciones": "1001663",
                            "cust_Rol": null,
                            "cust_Escenario": "CA_Compartidos",
                            "cust_Puesto": "J0004124",
                            "lastModifiedBy": "ATT_CPI",
                            "cust_ObjetivoDePosicion_Editado": "<ul><li>Facilitar los procesos claves de Recursos Humanos, con el fin de reducir costos de operación mediante la integración de aplicaciones, para sustituir los procesos manuales con procesos automatizados.</li><li>Analizar la información de los procesos de Recursos Humanos, mediante el uso de herramientas tecnológicas, para resaltar información útil que se adapte a las necesidades del área mejorando la eficacia y efectividad de la operación.</li><li>Administrar la plataforma tecnológica de Recursos Humanos, verificando que se adhieran a los procesos establecidos, en el aspecto técnico como administrativo, para garantizar la continuidad de la operación.</li></ul>",
                            "cust_Competencias": null,
