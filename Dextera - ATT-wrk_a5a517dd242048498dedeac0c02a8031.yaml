                        "cust_Titulo_Ingles": "Gerente Jr Adquisicion Vta Cruzada VAS",
                        "cust_Completado": "2",
                        "cust_Experiencia": "\nMínima:\t5 años\n\nDeseada:\t7 años\n\n",
                        "cust_Replica": "1",
                        "cust_InteraccionesRelaciones": "1001667",
                        "cust_PuestosAnteriores": "\nAnalista de Procesos\t3 años\n\nCoordinador de Producto / Captación VAS\t2 años\n\n",
                        "cust_PropositoDeInteraccion": "1001724",
                        "externalName": "392498",
                        "cust_TituloPuesto": "Gerente Jr Adquisicion Vta Cruzada VAS",
                        "cust_titulo_sugerido": null,
                        "cust_PrincipalesResponsabilidades": "\n1\t¿Qué?\tDefinir la estrategia de venta cruzada (cross selling) hacia la base existente de usuarios pospago\t25\n\n\t¿Cómo?\tidentificando necesidades puntuales que puedan ser atendidas con los productos existentes (add ons, paquetes, servicios adicionales) o a través de las alianzas con proveedores de VAS\t\n\n\t¿Para qué?\tincrementar los ingresos de la compañía a través de la monetización de la base de usuarios\t\n\n2\t¿Qué?\tDiseña y supervisa la implementación de iniciativas, ofertas o promociones de renovación\t25\n\n\t¿Cómo?\tasegurando el end to end de promociones y ofertas de renovación, asegurando una correcta implementación comercial y operativa así como asegurando mediciones recurrentes\t\n\n\t¿Para qué?\tpara implementar mejoras constantes\t\n\n3\t¿Qué?\tDiseña y supervisa la implementación de iniciativas, ofertas o promociones de retención\t25\n\n\t¿Cómo?\tasegurando que los equipos comerciales y de atención a clientes cuenten con las herramientas necesarias para evitar el abandono de usuarios, cuidando la rentabilidad de las iniciativas\t\n\n\t¿Para qué?\tpara asegurar una retención rentable, sostenible y eficiente\t\n\n4\t¿Qué?\tLidera la implementación de proyectos especiales de monetización\t25\n\n\t¿Cómo?\ta través de la coordinación de equipos multidisciplinarios, asegurando una implementación ágil, de la mano de las áreas claves de la empresa y dando seguimiento post implementacion\t\n\n\t¿Para qué?\tpara asegurar que los objetivos comprometidos por cada proyecto sean alcanzados, medidos y reportados de forma oportuna\n\n",
                        "cust_Rol": null,
                        "cust_Educacion": "\nMínima:\tLicenciatura/Ingeniería Pasante en Mercadotecnia, Administración, Ingeniería, Finanzas o afín.\n\nDeseada:\tMaestría Pasante en mercadotecnia, negocios o afín.\n\n",
                        "cust_Puesto": "J0003708",
                        "cust_ObjetivoDePosicion": "\n1.\tMandos medios\tDesarrollar estrategias de monetización de la base de usuarios pospago a través de iniciativas de cross selling (venta cruzada), renovación y extensión del tiempo de vida por retención\n\n2.\tMandos medios\tAsegurar la implementación de proyectos especiales de rentabilidad, monetización o mejoras operativas que repercutan directamente en los indicadores de ingreso, churn o retención de los usuarios pospago\n\n3.\tMandos medios\tSupervisar la correcta operación e implementación de estrategias de comunicación hacia la base de usuarios pospago, en los indicadores de renovación, retención, cross seeling y colocación de VAS\n\n",
                        "cust_Id_Workflow": null,
                        "cust_PaquetesDeComputo": "Oficce",
                        "cust_Grado": "A_14",
                        "cust_Digital": false,
                        "cust_Certificaciones": null,
                        "cust_Proceso_Hijo": "1",
                        "cust_UserActualizo": null,
                        "cust_Idiomas": "\nIdioma\tHabla\tEscribe\tLee\n\nIngles\tAvanzado\tAvanzado\tAvanzado\n\n",
                        "cust_ReportesDirectos": "2",
                        "cust_NIveles_Riesgo": null,
                        "cust_Competencias": null,
                        "cust_ObjetivoDePosicion_Editado": "Desarrollar estrategias de monetización de la base de usuarios pospago a través de iniciativas de cross selling (venta cruzada), renovación y extensión del tiempo de vida por retención Asegurar la implementación de proyectos especiales de rentabilidad, monetización o mejoras operativas que repercutan directamente en los indicadores de ingreso, churn o retención de los usuarios pospago Supervisar la correcta operación e implementación de estrategias de comunicación hacia la base de usuarios pospago, en los indicadores de renovación, retención, cross seeling y colocación de VAS",
                        "cust_PrincipalesResponsabilidades_Editado": "Definir la estrategia de venta cruzada (cross selling) hacia la base existente de usuarios pospago identificando necesidades puntuales que puedan ser atendidas con los productos existentes (add ons, paquetes, servicios adicionales) o a través de las alianzas con proveedores de VAS incrementar los ingresos de la compañía a través de la monetización de la base de usuarios Diseña y supervisa la implementación de iniciativas, ofertas o promociones de renovación asegurando el end to end de promociones y ofertas de renovación, asegurando una correcta implementación comercial y operativa así como asegurando mediciones recurrentes para implementar mejoras constantes Diseña y supervisa la implementación de iniciativas, ofertas o promociones de retención asegurando que los equipos comerciales y de atención a clientes cuenten con las herramientas necesarias para evitar el abandono de usuarios, cuidando la rentabilidad de las iniciativas para asegurar una retención rentable, sostenible y eficiente Lidera la implementación de proyectos especiales de monetización a través de la coordinación de equipos multidisciplinarios, asegurando una implementación ágil, de la mano de las áreas claves de la empresa y dando seguimiento post implementacion para asegurar que los objetivos comprometidos por cada proyecto sean alcanzados, medidos y reportados de forma oportuna",
                        "cust_Replica": "2",
                        "cust_Id_Workflow": "J0002893_20260723181156"
                      }
